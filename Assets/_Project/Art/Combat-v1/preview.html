<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Defesa Zumbi · Arsenal e animações</title>
<style>
@font-face{font-family:pixel;src:url('../../Resources/Fonts/PressStart2P-Regular.ttf')}
*{box-sizing:border-box}body{margin:0;background:#111525;color:#eee8cf;font-family:system-ui,sans-serif}header{padding:36px 5vw 24px;border-bottom:2px solid #384258;background:#191f31}small{color:#b6df79;font-family:pixel;font-size:9px}h1{font-family:pixel;font-size:clamp(19px,3vw,32px);line-height:1.7;margin:16px 0}p{color:#acb9c9;max-width:760px;line-height:1.6}nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}button,a{font:inherit}button{border:2px solid #4c5c6d;background:#243241;color:#eee8cf;padding:10px 14px;cursor:pointer}button:hover,button.active{background:#b6df79;color:#111525;border-color:#b6df79}main{padding:28px 5vw;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}.card{border:2px solid #384258;background:#1b2234;padding:18px;min-width:0}h2{font-family:pixel;font-size:12px;line-height:1.7;margin:0 0 12px}.art{background:repeating-conic-gradient(#222c40 0% 25%,#1c2536 0% 50%) 50%/24px 24px;border-bottom:2px solid #39485c}canvas{display:block;width:100%;image-rendering:pixelated}.controls{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}.controls button{font-size:12px;padding:8px}a{display:inline-block;color:#e7bd64;margin-top:14px;font-size:13px}footer{padding:20px 5vw;color:#94a1b7}label{font-size:13px;color:#c8d6df}select{background:#111525;color:#eee8cf;padding:8px;margin-left:6px;border:1px solid #52617a}
</style>
<header><small>DEFESA ZUMBI / ARTE DE COMBATE</small><h1>Arsenal em movimento</h1><p>Veja as armas, ouça seus sons e compare as defesas nas três lanes. Os zumbis têm preparação, golpe e recuperação.</p><nav><button class="active" data-group="Weapons">13 armas</button><button data-group="Defenses">Torres e barricadas</button><button data-group="Attacks">10 ataques de zumbis</button></nav></header>
<main id="gallery"></main><footer>Pixel art com fundo transparente. As animações também estão integradas ao jogo.</footer>
<script>
const items={Weapons:[['Pistol','Pistola'],['Bow','Arco e flecha'],['Nailgun','Parafusadeira'],['Revolver','Revólver'],['Boomerang','Bumerangue'],['Slingshot','Estilingue'],['Axe','Machado'],['Shuriken','Shuriken'],['Smg','Submetralhadora'],['Shotgun','Escopeta'],['Rifle','Carabina'],['Crossbow','Besta'],['Launcher','Lança-granadas']],Defenses:[['Shooter','Torre atiradora'],['Ice','Torre de gelo'],['Explosive','Torre explosiva'],['Barricade','Barricada com arame']],Attacks:[['Crawler','Errante'],['Walker','Andador'],['Runner','Corredor'],['Spitter','Cuspidor'],['Brute','Brutamontes'],['Boss','Comandante'],['Armored','Blindado'],['Volatile','Instável'],['Medic','Médico'],['Shade','Sombra']]};
let cards=[],group='Weapons',audio;
function play(key){if(audio)audio.pause();audio=new Audio('Sounds/'+key+'.wav');audio.volume=.65;audio.play().catch(()=>{});}
function show(next){group=next;cards=[];document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.group===group));gallery.replaceChildren();for(const [id,name] of items[group]){const card=document.createElement('article');card.className='card';const title=document.createElement('h2');title.textContent=name;const wrap=document.createElement('div');wrap.className='art';const canvas=document.createElement('canvas');canvas.width=canvas.height=320;canvas.setAttribute('aria-label',name+' em animação');wrap.append(canvas);const controls=document.createElement('div');controls.className='controls';const model={id,canvas,img:new Image(),running:true,lane:1,frame:0,start:performance.now()};model.img.src=group+'/'+id+'.png';const toggle=document.createElement('button');toggle.textContent='Pausar';toggle.onclick=()=>{model.running=!model.running;toggle.textContent=model.running?'Pausar':'Animar';};controls.append(toggle);if(group==='Weapons'){for(const [prefix,label] of [['shot_','Ouvir disparo'],['reload_','Ouvir recarga']]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>play(prefix+id);controls.append(b);}}if(group==='Defenses'){const select=document.createElement('select');select.setAttribute('aria-label','Lane de '+name);['Esquerda','Centro','Direita'].forEach((text,i)=>select.add(new Option(text,i,i===1,i===1)));select.onchange=()=>model.lane=+select.value;controls.append(select);}const link=document.createElement('a');link.href=model.img.src;link.textContent='Abrir folha completa';link.target='_blank';card.append(title,wrap,controls,link);gallery.append(card);cards.push(model);}}
function draw(now){for(const c of cards){if(!c.img.complete||!c.img.naturalWidth)continue;if(c.running)c.frame=group==='Defenses'?c.lane+(Math.floor((now-c.start)/600)%2)*3:Math.floor((now-c.start)/145)%6;const ctx=c.canvas.getContext('2d');ctx.clearRect(0,0,320,320);ctx.imageSmoothingEnabled=false;const w=c.img.naturalWidth/3,h=c.img.naturalHeight/2;ctx.drawImage(c.img,c.frame%3*w,Math.floor(c.frame/3)*h,w,h,0,0,320,320);}requestAnimationFrame(draw);}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.group));show('Weapons');requestAnimationFrame(draw);
</script></html>
